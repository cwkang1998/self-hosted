x-omp-image: &omp-image
  build:
    context: .
    dockerfile: Dockerfile
  image: containerized-omp:latest

services:
  omp-volume-init:
    <<: *omp-image
    user: root
    command: ["docker-volume-init"]
    volumes:
      - omp-home:/home/coder

  omp:
    <<: *omp-image
    depends_on:
      omp-volume-init:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    command: ["zsh", "-lc", "trap : TERM INT; while true; do sleep 3600 & wait $!; done"]
    working_dir: /home/coder/workspace
    environment:
      TERM: xterm-256color
      SHELL: /usr/bin/zsh
    volumes:
      - omp-home:/home/coder
      - /Users/chen/Projects:/home/coder/workspace

volumes:
  omp-home:
