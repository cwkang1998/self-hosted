x-codex-image: &codex-image
  build:
    context: .
    dockerfile: Dockerfile
  image: containerized-codex:latest

services:
  codex-volume-init:
    <<: *codex-image
    user: root
    command: ["docker-volume-init"]
    volumes:
      - codex-home:/home/coder
      - icm-data:/home/coder/.local/share/icm

  codex:
    <<: *codex-image
    depends_on:
      codex-volume-init:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    command: ["zsh", "-lc", "trap : TERM INT; while true; do sleep 3600 & wait $!; done"]
    working_dir: /home/coder/app
    environment:
      TERM: xterm-256color
      SHELL: /usr/bin/zsh
    volumes:
      - codex-home:/home/coder
      - icm-data:/home/coder/.local/share/icm
      - <your-working-directory>:/home/coder/app

volumes:
  codex-home:
  icm-data:
  working-directory:
